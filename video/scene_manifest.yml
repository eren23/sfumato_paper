# Sfumato Paper 1 video --- single curated story.
#
# The story moves through three concerns: the three-axis decomposition
# of hybrid AR/DDLM failures and the two trainable fixes (axes + Track 2);
# the test-time aggregation arc (voting-rule gap, verifier sweep, mode
# router, temporal-SC, schedule-RLHF, base-swap --- all parallel
# negatives reinforcing the same diagnosis); and the scope arc (K2
# schedule toggle, cross-family generality, AR-baseline disclosure).
# Scene 11 is the mid-arc transition out of the axes story; scene 24 is
# the unified close.
scenes:
  - id: scene00_intro
    file: scenes/scene00_intro.py
    class: IntroScene
  - id: scene01_metaphor
